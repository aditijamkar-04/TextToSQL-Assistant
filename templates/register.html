
{% extends "base.html" %}
{% block title %}Register | Text-to-SQL Assistant{% endblock %}
{% block content %}
<section class="card" style="max-width: 500px; margin: auto;">
    <h1>Create User Account</h1>
    <p class="muted">Passwords must contain at least 12 characters.</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Username</label>
        <input id="username" name="username" minlength="3" maxlength="50"
               autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" name="password"
               minlength="12" autocomplete="new-password" required>
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" type="password" name="confirm_password"
               minlength="12" autocomplete="new-password" required>
        <button type="submit">Register</button>
    </form>
    <p>Already registered? <a href="{{ url_for('signin') }}">Sign in</a>.</p>
</section>
{% endblock %}
